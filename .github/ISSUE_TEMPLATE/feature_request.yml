name: Feature request
description: Explain the audio task you would like to make easier.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: "Describe the apps, output devices, and situation."
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired result
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
